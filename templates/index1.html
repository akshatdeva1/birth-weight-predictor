<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Weight Prediction</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            background:linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            padding:40px 0;
        }

        .container{
            width:450px;
            background:white;
            padding:35px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
            margin-bottom:40px;
        }

        h1{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
            font-size:28px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
            color:#444;
        }

        input,
        select{
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:10px;
            font-size:15px;
            transition:0.3s;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#4f46e5;
            box-shadow:0 0 8px rgba(79,70,229,0.3);
        }

        button{
            width:100%;
            padding:14px;
            background:#4f46e5;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        button:hover{
            background:#3730a3;
            transform:translateY(-2px);
        }

        .result{
            margin-top:25px;
            padding:15px;
            background:#eef2ff;
            border-radius:10px;
            text-align:center;
        }

        .result h3{
            color:#3730a3;
            font-size:20px;
        }

        @media(max-width:500px){
            .container{
                width:90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Predict Birth Weight of Your Child</h1>

        <form action="/predict" method="POST">

            <div class="form-group">
                <label for="gestation">Gestation</label>
                <input type="number" name="gestation" id="gestation" required>
            </div>

            <div class="form-group">
                <label for="parity">Parity</label>
                <input type="number" name="parity" id="parity" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" name="age" id="age" required>
            </div>

            <div class="form-group">
                <label for="height">Height</label>
                <input type="number" name="height" id="height" required>
            </div>

            <div class="form-group">
                <label for="weight">Weight</label>
                <input type="number" name="weight" id="weight" required>
            </div>

            <div class="form-group">
                <label for="smoke">Smoking Status</label>
                <select name="smoke" id="smoke" required>
                    <option value="" disabled selected>Select smoking status</option>
                    <option value="0">Non-Smoker</option>
                    <option value="1">Smoker</option>
                </select>
            </div>

            <button type="submit">
                Predict Birth Weight
            </button>

        </form>

        {% if prediction %}
        <div class="result">
            <h3>Predicted Birth Weight: {{ prediction }} grams</h3>
        </div>
        {% endif %}

    </div>

</body>
</html>
